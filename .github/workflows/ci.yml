name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate repository invariants
        run: python scripts/check_repository.py

      - name: Parse JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('.').rglob('*.json')):
              if '.pytest_cache' in path.parts or '__pycache__' in path.parts:
                  continue
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated JSON: {path}')
          PY

  validator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests conformance scripts

      - name: Type check
        run: |
          python -m pip install mypy types-jsonschema
          mypy src

      - name: Unit, schema, semantic, and adversarial tests
        run: pytest -q

      - name: Conformance corpora (0.1-draft, 0.1-rc.1, 0.2-alpha.1)
        run: python conformance/run_corpus.py

      - name: Validate packaged examples through the CLI
        run: |
          mncds validate examples/mncds-0.1-rc/development-record.json --require-pass --json > /dev/null || test $? -eq 3
          mncds validate examples/mncds-0.2-alpha/language-span-fix.development-record.json --require-pass
          mncds validate examples/mncds-0.2-alpha/d4-release-lifecycle.fixture.json --json > /dev/null || test $? -eq 3
          mncds version --json

      - name: Schema bundle is packaged and loadable
        run: |
          python - <<'PY'
          from mncds_validator.schemas import SCHEMA_NAMES, load_schema
          for name in sorted(SCHEMA_NAMES):
              schema = load_schema(name)
              assert schema["$id"], name
              print(f"schema ok: {name} -> {schema['$id']}")
          PY

  mncs-actions-transport:
    # MNCDS as a first-class family producer: the owner-native validator
    # output feeds mncs-actions transport at a pinned revision, applying
    # docs/mncds-check-catalog.md without redefining its semantics.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out pinned mncs-actions transport
        uses: actions/checkout@v5
        with:
          repository: epi13/mncs-actions
          ref: 4b132651d50b31ae12f5f00c749ee1f32adb6322
          path: mncs-actions
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install package
        run: python -m pip install -e .

      - name: Project development record through transport
        run: |
          mncds validate examples/mncds-0.2-alpha/language-span-fix.development-record.json --json > /tmp/mncds-report.json
          python3 mncs-actions/adapters/mncds_adapter.py --input /tmp/mncds-report.json --output /tmp/mncds-check.json --check-id mncds-development-record --provider mncds --contract-revision 0.2-alpha.1 --subject-repository epi13/machine-native-complexity-development-specification --subject-commit "$GITHUB_SHA"
          python3 -c "import json, os; check = json.load(open('/tmp/mncds-check.json')); assert check['verdict'] == 'PASS', check; assert check['subject']['commit'] == os.environ['GITHUB_SHA'], check; print('mncds-development-record -> ' + check['verdict'])"
