name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate repository invariants
        run: python scripts/check_repository.py

      - name: Parse JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('.').rglob('*.json')):
              if '.pytest_cache' in path.parts or '__pycache__' in path.parts:
                  continue
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated JSON: {path}')
          PY

  validator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests conformance scripts

      - name: Type check
        run: |
          python -m pip install mypy
          mypy src

      - name: Unit, schema, semantic, and adversarial tests
        run: pytest -q

      - name: Conformance corpora (0.1-draft, 0.1-rc.1, 0.2-alpha.1)
        run: python conformance/run_corpus.py

      - name: Validate packaged examples through the CLI
        run: |
          mncds validate examples/mncds-0.1-rc/development-record.json --require-pass --json > /dev/null || test $? -eq 3
          mncds validate examples/mncds-0.2-alpha/language-span-fix.development-record.json --require-pass
          mncds validate examples/mncds-0.2-alpha/d4-release-lifecycle.fixture.json --json > /dev/null || test $? -eq 3
          mncds version --json

      - name: Schema bundle is packaged and loadable
        run: |
          python - <<'PY'
          from mncds_validator.schemas import SCHEMA_NAMES, load_schema
          for name in sorted(SCHEMA_NAMES):
              schema = load_schema(name)
              assert schema["$id"], name
              print(f"schema ok: {name} -> {schema['$id']}")
          PY
